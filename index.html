<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIS2 Asset Manager | 3NF Dashboard</title>
    
    <!-- Bootstrap 5 per un'estetica professionale immediata -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .navbar { background-color: #000; padding: 1rem; }
        .card { border: none; border-radius: 12px; }
        .table thead { background-color: #f8f9fa; }
        .badge-alta { background-color: #dc3545; color: white; }
        .badge-media { background-color: #ffc107; color: #000; }
        .loading-spinner { display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🛡️ NIS2 Asset Inventory Manager</span>
        <span class="badge bg-success">DB in 3NF Connesso</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4">Dashboard Asset Critici</h2>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome Asset</th>
                                    <th>Versione Software</th>
                                    <th>Bollettino ACN</th>
                                    <th>Livello Rischio</th>
                                    <th>Analisi Vulnerabilità (CVE)</th>
                                </tr>
                            </thead>
                            <tbody id="asset-table-body">
                                <!-- I dati verranno caricati qui -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="no-data" class="text-center py-4 d-none">
                        <p class="text-muted">Nessun dato trovato nel database.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. CONFIGURAZIONE CREDENZIALI (REAL)
    const SUPABASE_URL = 'https://jacyruehgxjzxufzfoly.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_s5aXWNZZ7ZuHYKVo_XpdqA_lJV8wHUw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. FUNZIONE DI RECUPERO DATI (LOGICA 3NF)
    async function fetchAssets() {
        // Interroghiamo la tabella asset e facciamo il JOIN automatico con vulnerabilita
        const { data, error } = await supabaseClient
            .from('asset')
            .select(`
                id,
                nome,
                versione,
                vulnerabilita (
                    codice_bollettino,
                    descrizione_rischio,
                    livello_severita
                )
            `);

        if (error) {
            console.error('Errore durante il recupero dei dati:', error);
            alert('Errore di connessione a Supabase. Controlla la console.');
            return;
        }

        renderTable(data);
    }

    // 3. RENDERING DELLA TABELLA
    function renderTable(assets) {
        const tableBody = document.getElementById('asset-table-body');
        const noDataMsg = document.getElementById('no-data');

        if (!assets || assets.length === 0) {
            noDataMsg.classList.remove('d-none');
            return;
        }

        tableBody.innerHTML = assets.map(asset => {
            // Gestione dei dati mancanti se l'asset non ha vulnerabilità collegate
            const vuln = asset.vulnerabilita || { 
                codice_bollettino: 'N/A', 
                descrizione_rischio: 'Nessun rischio rilevato', 
                livello_severita: 'Sicuro' 
            };

            const badgeClass = vuln.livello_severita === 'Alta' ? 'badge-alta' : 
                               vuln.livello_severita === 'Sicuro' ? 'bg-success' : 'badge-media';

            return `
                <tr>
                    <td><span class="text-muted">#${asset.id}</span></td>
                    <td><strong>${asset.nome}</strong></td>
                    <td><code>${asset.versione}</code></td>
                    <td><span class="text-primary fw-bold">${vuln.codice_bollettino}</span></td>
                    <td><span class="badge ${badgeClass}">${vuln.livello_severita}</span></td>
                    <td><small class="text-wrap" style="max-width: 300px;">${vuln.descrizione_rischio}</small></td>
                </tr>
            `;
        }).join('');
    }

    // Inizializzazione al caricamento della pagina
    window.onload = fetchAssets;
</script>

<footer class="container text-center mt-5 mb-3">
    <hr>
    <p class="text-muted small">Tesi L31 - Sviluppo conforme a direttiva NIS2 e standard ACN</p>
</footer>

</body>
</html>
